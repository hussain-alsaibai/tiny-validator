[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tiny-validator"
version = "0.6.0"
description = "Zero-dependency input validation. Like Pydantic in one file. 247K val/s."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [{name = "OpenClaw", email = "hussain.alsaibai@gmail.com"}]
keywords = ["validation", "validator", "pydantic", "schema", "types", "input"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]


[tool.setuptools]
# Without an explicit py-modules list, setuptools flat-layout auto-discovery
# produces an EMPTY wheel: `pip install tiny-validator` installs no importable module.
py-modules = ["tiny_validator", "tiny_validator_mcp"]
