name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # ubuntu-latest moved to 26.04, which has no setup-python build of
    # 3.8/3.9 - those matrix rows die before a test runs.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: pip install pytest
      - name: Run tests
        run: python -m pytest test_tiny_validator.py test_v040_export.py test_v050_mcp.py test_v060_export.py test_rules.py test_version_consistency.py -v

